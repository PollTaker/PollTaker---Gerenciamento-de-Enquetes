<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Enquete - PollTaker</title>
    <style>
        :root {
            --bg-space: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --neon-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--bg-space) 90%);
            color: var(--text-main);
            margin: 0; padding: 40px 20px; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .container {
            max-width: 600px; width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 35px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { color: var(--neon-cyan); margin-bottom: 20px; font-size: 1.5rem; }
        form { display: flex; flex-direction: column; gap: 12px; }
        input, select, textarea {
            padding: 12px; font-size: 14px; border-radius: 8px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: white; outline: none; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
        .opcoes-section {
            background: rgba(30, 41, 59, 0.4);
            padding: 15px; border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            display: flex; flex-direction: column; gap: 10px;
        }
        .opcoes-section label { color: var(--neon-cyan); font-size: 0.9rem; font-weight: 600; }
        button {
            padding: 12px; font-size: 14px; border-radius: 8px; border: none;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: all 0.3s; margin-top: 5px;
        }
        button:hover { opacity: 0.9; }
        a { text-decoration: none; color: var(--neon-cyan); font-size: 0.9rem; display: inline-block; margin-bottom: 15px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <a href="/app/enquetes">&larr; Voltar ao Painel Orbital</a>
    <h2>🚀 Nova Enquete e Opções</h2>

    <form th:action="@{/app/enquetes}" th:object="${enqueteDto}" method="post">
        <input type="text" th:field="*{titulo}" placeholder="Título da Enquete" required />
        <textarea th:field="*{descricao}" placeholder="Descrição detalhada da missão/pesquisa..." rows="3"></textarea>
        <input type="datetime-local" th:field="*{dataEncerramento}" required />

        <div class="opcoes-section">
            <label>Opções de Voto (Mínimo 2 obrigatórias):</label>
            <input type="text" name="opcoes[0]" placeholder="Opção 1 (Ex: Java & Spring)" required />
            <input type="text" name="opcoes[1]" placeholder="Opção 2 (Ex: Node.js)" required />
            <input type="text" name="opcoes[2]" placeholder="Opção 3 (Opcional)" />
        </div>

        <button type="submit">Lançar Enquete com Opções</button>
    </form>
</div>
</body>
</html>
