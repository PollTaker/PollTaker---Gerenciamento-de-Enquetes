<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Painel de Enquetes - PollTaker</title>
    <style>
        :root {
            --bg-space: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --neon-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(56, 189, 248, 0.2);
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--bg-space) 90%);
            color: var(--text-main);
            margin: 0; padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px; margin: auto;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            padding: 30px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: var(--neon-cyan); font-size: 1.8rem; margin: 0; }
        .btn {
            padding: 10px 16px; background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white; border-radius: 8px; text-decoration: none; font-weight: 600;
            font-size: 0.9rem; transition: all 0.3s; display: inline-block;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn:hover { box-shadow: 0 0 12px rgba(56, 189, 248, 0.5); transform: translateY(-1px); }
        .btn-sec { background: rgba(30, 41, 59, 0.9); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 14px; border-bottom: 1px solid rgba(148, 163, 184, 0.1); text-align: left; }
        th { background: rgba(30, 41, 59, 0.6); color: var(--neon-cyan); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        td { font-size: 0.95rem; color: #cbd5e1; }
        tr:hover { background: rgba(56, 189, 248, 0.03); }
        .badge { background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-flex">
        <h1>🌌 Painel de Enquetes</h1>
        <div>
            <a href="/app/enquetes/novo" class="btn">+ Nova Enquete</a>
            <a href="/app/usuarios" class="btn btn-sec" sec:authorize="hasRole('ADMIN')">Gerenciar Usuários</a>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Título da Enquete</th>
            <th>Status</th>
            <th>Criador</th>
            <th>Comando</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${enquetes}">
            <td th:text="${e.titulo}" style="font-weight: 500; color: white;">Título</td>
            <td><span class="badge" th:text="${e.status}">ABERTA</span></td>
            <td th:text="${e.criadorNome}">Criador</td>
            <td>
                <a th:href="@{/app/enquetes/{id}(id=${e.id})}" class="btn" style="padding: 6px 12px; font-size: 0.8rem;">Acessar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
